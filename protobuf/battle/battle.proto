syntax = "proto3";

package wenjian.battle;

option java_multiple_files = true;
option java_package = "com.wenjian.protobuf.battle";

import "common/common.proto";

message SkillIntent {
  int32 skill_id = 1;
  wenjian.common.Vec2i aim_dir = 2;
}

message InputFrame {
  int64 seq = 1;
  int64 client_time_ms = 2;
  int32 move_x = 3;
  int32 move_y = 4;
  SkillIntent skill = 5;
}

message SkillEvent {
  int64 caster_id = 1;
  int32 skill_id = 2;
  wenjian.common.Vec2i position = 3;
  wenjian.common.Vec2i aim_dir = 4;
}

message DamageEvent {
  int64 source_id = 1;
  int64 target_id = 2;
  int32 skill_id = 3;
  int32 hp_delta = 4;
  bool dead = 5;
}
